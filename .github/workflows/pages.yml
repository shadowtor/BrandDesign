name: Deploy site to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "examples/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Assemble the site (page + the example previews it shows)
        run: |
          mkdir _site
          cp -r site/. _site/
          mkdir -p _site/examples
          cp examples/overview.png _site/examples/
          for b in kiln rookery marigold; do
            mkdir -p "_site/examples/$b/final" "_site/examples/$b/preview"
            cp "examples/$b/final/symbol.svg" "_site/examples/$b/final/"
            cp -r "examples/$b/preview/mockups" "_site/examples/$b/preview/"
            cp examples/$b/preview/*.pdf "_site/examples/$b/preview/"
          done
          touch _site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
